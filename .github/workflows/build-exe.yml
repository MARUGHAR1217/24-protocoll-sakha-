
name: Build PROTOCOL SAKHA EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-exe.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'Index.html'
      - 'index.html'
      - '**/Index.html'
      - '**/index.html'
      - 'main.js'
      - 'preload.js'
      - 'prompt-preload.js'
      - 'prompt.html'
      - 'native-plugins-entry.js'
      - 'native-shim.js'
      - 'NotoSansGujarati-*.ttf'
      - 'icon.png'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare application files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $html = $null

          if (Test-Path -LiteralPath ".\index.html" -PathType Leaf) {
            $html = (Resolve-Path -LiteralPath ".\index.html").Path
          }
          elseif (Test-Path -LiteralPath ".\Index.html" -PathType Leaf) {
            $html = (Resolve-Path -LiteralPath ".\Index.html").Path
          }
          else {
            $found = Get-ChildItem -Path . -Recurse -File |
              Where-Object {
                $_.Name -ieq "index.html" -and
                $_.FullName -notmatch '[\\/](\.git|node_modules|dist|www|android)[\\/]'
              } |
              Select-Object -First 1

            if ($null -eq $found) {
              Write-Host "Files in repository root:"
              Get-ChildItem -Force
              throw "ERROR: Index.html or index.html was not found."
            }

            $html = $found.FullName
          }

          $sourcePath = [System.IO.Path]::GetFullPath($html)
          Write-Host "Using HTML file: $sourcePath"

          New-Item -ItemType Directory -Force -Path ".\www" | Out-Null

          $rootTarget = [System.IO.Path]::GetFullPath(".\index.html")
          if ($sourcePath -ne $rootTarget) {
            Copy-Item -LiteralPath $sourcePath -Destination $rootTarget -Force
          }

          $wwwTarget = [System.IO.Path]::GetFullPath(".\www\index.html")
          if ($sourcePath -ne $wwwTarget) {
            Copy-Item -LiteralPath $sourcePath -Destination $wwwTarget -Force
          }

          foreach ($file in @(
            "main.js",
            "preload.js",
            "prompt-preload.js",
            "prompt.html",
            "native-plugins-entry.js",
            "native-shim.js"
          )) {
            $sourceFile = Join-Path (Split-Path $sourcePath -Parent) $file

            if (Test-Path -LiteralPath $sourceFile -PathType Leaf) {
              Copy-Item -LiteralPath $sourceFile -Destination ".\www\$file" -Force
            }
            elseif (Test-Path -LiteralPath ".\$file" -PathType Leaf) {
              Copy-Item -LiteralPath ".\$file" -Destination ".\www\$file" -Force
            }
          }

          Get-ChildItem -Path . -Filter "NotoSansGujarati-*.ttf" -File |
            Copy-Item -Destination ".\www" -Force

          if (-not (Test-Path -LiteralPath ".\icon.png" -PathType Leaf)) {
            throw "ERROR: icon.png is missing from the repository root."
          }

          New-Item -ItemType Directory -Force -Path ".\build" | Out-Null
          Copy-Item -LiteralPath ".\icon.png" -Destination ".\build\icon.png" -Force

          if (-not (Test-Path -LiteralPath ".\www\index.html" -PathType Leaf)) {
            throw "ERROR: www/index.html was not prepared."
          }

          Write-Host "Application files prepared successfully."

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm install --legacy-peer-deps

          if ($LASTEXITCODE -ne 0) {
            throw "npm install failed."
          }

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          npx --yes electron-builder --win --x64

          if ($LASTEXITCODE -ne 0) {
            throw "Windows EXE build failed."
          }

      - name: Verify EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path ".\dist")) {
            throw "ERROR: The dist folder was not created."
          }

          $exe = Get-ChildItem -Path ".\dist" -Filter "*.exe" -File -Recurse |
            Where-Object { $_.FullName -notmatch '[\\/]win-unpacked[\\/]' } |
            Select-Object -First 1

          if ($null -eq $exe) {
            throw "ERROR: No distributable EXE was generated."
          }

          Write-Host "EXE generated: $($exe.FullName)"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-exe
          path: dist/**/*.exe
          if-no-files-found: error

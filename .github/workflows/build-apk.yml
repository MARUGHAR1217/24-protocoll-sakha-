name: Build PROTOCOL SAKHA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps @capacitor/cli @capacitor/core @capacitor/android

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html
          for f in main.js native-plugins-entry.js native-shim.js NotoSansGujarati-*.ttf; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate Android launcher icons from original icon.png
        run: |
          test -f icon.png
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("icon.png").convert("RGBA")
          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          res = Path("android/app/src/main/res")
          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          # Use the same original artwork for adaptive launcher icons.
          for name in ("ic_launcher_foreground.png", "ic_launcher.png"):
              folder = res / "drawable"
              folder.mkdir(parents=True, exist_ok=True)
              source.save(folder / name)

          print("Original icon.png applied to Android launcher resources.")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

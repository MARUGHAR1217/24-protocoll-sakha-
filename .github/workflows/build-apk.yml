name: Build PROTOCOL SAKHA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'
      - 'package.json'
      - 'capacitor.config.json'
      - 'index.html'
      - 'NotoSansGujarati-*.ttf'
      - 'icon*.png'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure Capacitor packages are installed
        run: npm install --no-save --legacy-peer-deps @capacitor/cli @capacitor/core @capacitor/android

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html
          for f in NotoSansGujarati-*.ttf icon.png icon-only.png icon-foreground.png icon-background.png; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          test -f www/index.html
          cat capacitor.config.json

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

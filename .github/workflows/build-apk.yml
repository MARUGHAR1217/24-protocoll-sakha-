name: Build PROTOCOL SAKHA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'index.html'
      - 'main.js'
      - 'native-plugins-entry.js'
      - 'native-shim.js'
      - 'NotoSansGujarati-*.ttf'
      - 'icon.png'
      - 'icon-only.png'
      - 'icon-foreground.png'
      - 'icon-background.png'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure Capacitor packages are installed
        run: |
          npm install --no-save --legacy-peer-deps \
            @capacitor/cli @capacitor/core @capacitor/android

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html

          for f in main.js native-plugins-entry.js native-shim.js NotoSansGujarati-*.ttf; do
            if [ -f "$f" ]; then
              cp "$f" www/
            fi
          done

          test -f www/index.html
          test -f icon.png

          echo "Web assets prepared."

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply original app icon
        run: |
          python3 -m pip install --quiet Pillow

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source_path = Path("icon.png")
          if not source_path.is_file():
              raise SystemExit("ERROR: Original icon.png was not found.")

          source = Image.open(source_path).convert("RGBA")

          if source.width != source.height:
              raise SystemExit(
                  f"ERROR: icon.png must be square; found {source.width}x{source.height}."
              )

          res = Path("android/app/src/main/res")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              icon = source.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          # Remove adaptive-icon XML so Android uses the original
          # raster icon files generated from icon.png.
          adaptive = res / "mipmap-anydpi-v26"

          if adaptive.exists():
              for filename in (
                  "ic_launcher.xml",
                  "ic_launcher_round.xml",
              ):
                  path = adaptive / filename
                  if path.exists():
                      path.unlink()

          print("Original icon.png applied to launcher icon resources.")
          PY

      - name: Build APK
        run: |
          cat > /tmp/fix-kotlin.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin',
                      module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin',
                      module: 'kotlin-stdlib-jdk8'
            }
          }
          EOF

          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon \
            --init-script /tmp/fix-kotlin.gradle \
            assembleDebug

      - name: Verify APK exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK build completed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
